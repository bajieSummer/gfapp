<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>端侧大模型推荐中心（外置大脑）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f4f8fe 0%, #e9eff5 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            color: #1a2c3a;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 0 0.5rem;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(120deg, #1e4663, #2b7551);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.2px;
        }

        .page-header p {
            color: #4a627a;
            font-size: 0.9rem;
            margin-top: 0.4rem;
            border-bottom: 2px solid rgba(43, 117, 81, 0.2);
            display: inline-block;
            padding-bottom: 0.3rem;
        }

        /* 竖排列表 */
        .detail-list {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-height: 70vh;
            overflow-y: auto;
            padding: 0.25rem 0.25rem 0.5rem 0.25rem;
            border-radius: 1.5rem;
        }

        .detail-list::-webkit-scrollbar {
            width: 5px;
        }
        .detail-list::-webkit-scrollbar-track {
            background: #e0e9ef;
            border-radius: 10px;
        }
        .detail-list::-webkit-scrollbar-thumb {
            background: #7eae94;
            border-radius: 10px;
        }

        .list-item {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(2px);
            border-radius: 1.5rem;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
            border: 1px solid rgba(207, 223, 210, 0.5);
            padding: 1.2rem 1.2rem;
        }

        .list-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px -8px rgba(0, 0, 0, 0.12);
            border-color: #c2dbc9;
            background: white;
        }

        .item-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e3b2f;
            margin-bottom: 0.4rem;
            letter-spacing: -0.2px;
        }

        .item-description {
            font-size: 0.85rem;
            color: #4d6a7e;
            line-height: 1.4;
            margin-bottom: 0.8rem;
            border-left: 3px solid #6fbc8c;
            padding-left: 0.6rem;
            background: #fcfef9;
            border-radius: 0 12px 12px 0;
        }

        .link-area {
            background: #f0f5f2;
            padding: 0.6rem 0.8rem;
            border-radius: 1rem;
            word-break: break-all;
            font-size: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .link-url {
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: #236e4a;
            background: white;
            padding: 0.3rem 0.6rem;
            border-radius: 40px;
            font-size: 0.8rem;
            flex: 1;
            word-break: break-all;
        }

        .detail-link {
            background: #2b7551;
            color: white;
            text-decoration: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.2s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .detail-link:hover {
            background: #1e5e41;
            transform: scale(0.97);
        }

        .footer-thanks {
            text-align: center;
            margin-top: 2rem;
            padding: 1rem;
            font-size: 0.95rem;
            color: #2b7551;
            background: rgba(255, 255, 240, 0.7);
            border-radius: 40px;
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }
            .link-area {
                flex-direction: column;
                align-items: stretch;
            }
            .detail-link {
                text-align: center;
                justify-content: center;
            }
            .item-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1>🔗 资源导航</h1>
        <p>点击链接即可查看详情</p>
    </div>

    <!-- 竖排列表，直接显示，无需验证 -->
    <div class="detail-list">
        <!-- 项目1 -->
        <div class="list-item">
            <div class="item-title">📘 阿里千问的端侧大模型</div>
            <div class="item-description">
                当前模型位阿里
            </div>
            <div class="link-area">
                <span class="link-url">https://docs.example.com/api/v3/guide</span>
                <a class="detail-link" href="https://docs.example.com/api/v3/guide" target="_blank" rel="noopener noreferrer">
                    🔗 访问详情
                </a>
            </div>
        </div>

        <!-- 项目2 -->
        <div class="list-item">
            <div class="item-title">📊 数据报表库</div>
            <div class="item-description">
                2025 年度销售看板与市场分析报告（在线预览）。
            </div>
            <div class="link-area">
                <span class="link-url">https://reports.example.com/dashboard/2025</span>
                <a class="detail-link" href="https://reports.example.com/dashboard/2025" target="_blank" rel="noopener noreferrer">
                    🔗 访问详情
                </a>
            </div>
        </div>

        <!-- 项目3 -->
        <div class="list-item">
            <div class="item-title">🎨 设计资源库</div>
            <div class="item-description">
                图标库、UI 套件及品牌素材，仅供内部查阅。
            </div>
            <div class="link-area">
                <span class="link-url">https://design.example.com/assets/library</span>
                <a class="detail-link" href="https://design.example.com/assets/library" target="_blank" rel="noopener noreferrer">
                    🔗 访问详情
                </a>
            </div>
        </div>
    </div>

    <!-- 感谢区（带星星） -->
    <div class="footer-thanks">
        ⭐⭐⭐ 感谢您的访问，祝您浏览愉快 ⭐⭐⭐
    </div>
</div>
</body>
</html>
